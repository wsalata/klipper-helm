# Copy to ~/.config/klipper-helm/config.toml (or point to it with KLIPPER_HELM_CONFIG).
# The panel writes the same file (System → Panel settings).
# The address in this file wins; MOONRAKER_URL is only used when it is missing here.

moonraker_url = "ws://127.0.0.1:7125/websocket"

# UI language: "auto" (system locale), "en" or "pl"
language = "auto"

# Manual movement speeds [mm/s]
xy_speed = 100
z_speed = 10

[[preset]]
name = "PLA"
extruder = 210
bed = 60

[[preset]]
name = "PETG"
extruder = 240
bed = 80

[[preset]]
name = "ABS"
extruder = 250
bed = 100
