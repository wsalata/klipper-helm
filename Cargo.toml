[package]
name = "klipper-helm"
version = "0.1.1"
edition = "2026"
description = "Touch screen panel for Klipper (a KlipperScreen replacement) in Rust + Slint"

[dependencies]
# Always: DRM/KMS output with libinput and the software renderer (no GPU needed).
# The `desktop` feature adds a window (winit) and GPU rendering for working on a PC.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-linuxkms-noseat",
    "renderer-software",
] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
# Thumbnails (HTTP from Moonraker) and updates (HTTPS from GitHub, rustls with built-in roots); PNG decoding
ureq = { version = "3", default-features = false, features = ["rustls"] }
png = "0.18"

[features]
default = ["desktop"]
# Panel in a window on a PC (X11/Wayland) with GPU rendering and accessibility
desktop = ["slint/backend-default", "slint/renderer-femtovg", "slint/accessibility"]
# Embedded image (buildroot/): KMS + software renderer only, build with
# `--no-default-features --features embedded`
embedded = []

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
