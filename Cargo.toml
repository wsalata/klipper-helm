[package]
name = "klipper-helm"
version = "0.3.3"
edition = "2024"
description = "Touch screen panel for Klipper (a KlipperScreen replacement) in Rust + Slint"
repository = "https://github.com/wsalata/klipper-helm"
# An application installed from GitHub releases (install.sh), not a crate for crates.io
publish = false

# `cargo release patch|minor --execute`: bump, commit, tag vX.Y.Z and push; the tag starts the
# release workflow
[package.metadata.release]
push-remote = "github"
# Never to crates.io
publish = false
pre-release-commit-message = "Release {{version}}"
tag-message = "Klipper Helm {{version}}"

[dependencies]
# Always: DRM/KMS output with libinput and the software renderer (no GPU needed).
# The `desktop` feature adds a window (winit) and GPU rendering for working on a PC.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-linuxkms-noseat",
    "renderer-software",
] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
# Thumbnails: HTTP from Moonraker on the local network (no TLS), PNG decoding
ureq = { version = "3", default-features = false }
png = "0.18"
cargo-release = "1.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Asks the screen for its modes before Slint starts (see display::probe); same version as Slint uses
drm = "0.14"

[features]
default = ["desktop"]
# Panel in a window on a PC (X11/Wayland) with GPU rendering and accessibility
desktop = ["slint/backend-default", "slint/renderer-femtovg", "slint/accessibility"]
# Release build for the printer's computer (Raspberry Pi): KMS + software renderer only,
# `--no-default-features --features embedded`
embedded = []

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
