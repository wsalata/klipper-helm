# Publishes a version tag (vX.Y.Z) as a GitHub release with the panel binaries. install.sh
# installs the latest release, and Moonraker's update manager (type "executable") updates
# panels from newer ones, so the binary names must not change.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum * > SHA256SUMS
          ls -la
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "Klipper Helm $GITHUB_REF_NAME" \
            --generate-notes
