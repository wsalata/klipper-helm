# RAUC: A/B root filesystems, switched by U-Boot (boot.cmd) through its environment
[system]
compatible=klipper-helm-odroidxu4
bootloader=uboot
bundle-formats=-plain
data-directory=/data/rauc

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partuuid/4b484c4d-02
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/4b484c4d-03
type=ext4
bootname=B
