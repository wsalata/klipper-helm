# Read by mainline U-Boot (standard boot). The root partition is found by its
# PARTUUID, so the same image boots from an SD card or the eMMC module.
# Kernel messages go to the serial console only; the screen shows the boot logo (centred) until
# the panel starts. loglevel=5 instead of quiet: quiet would also hide the logo.
# For display problems add drm.debug=0x4 (why modes are accepted or rejected, saved to
# /data/logs/dmesg.txt) and console=tty1 (boot messages on the screen).
label klipper-helm
	kernel /zImage
	fdt /exynos5422-odroidxu4.dtb
	append console=ttySAC2,115200n8 root=PARTUUID=4b484c4d-02 rootwait ro loglevel=5 fbcon=logo-pos:center net.ifnames=0 vt.global_cursor_default=0
