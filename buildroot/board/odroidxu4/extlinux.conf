# Read by mainline U-Boot (standard boot). The root partition is found by its
# PARTUUID, so the same image boots from an SD card or the eMMC module.
# Kernel messages go to the serial console only, so HDMI stays dark until the panel starts.
label klipper-helm
	kernel /zImage
	fdt /exynos5422-odroidxu4.dtb
	append console=ttySAC2,115200n8 root=PARTUUID=4b484c4d-02 rootwait ro quiet vt.global_cursor_default=0
