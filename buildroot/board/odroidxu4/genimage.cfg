image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"zImage",
			"exynos5422-odroidxu4.dtb"
		}
		file extlinux/extlinux.conf {
			image = "extlinux.conf"
		}
	}
	size = 32M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		# Referenced by root=PARTUUID=4b484c4d-02 in extlinux.conf
		disk-signature = 0x4b484c4d
	}

	# Signed boot chain required by the Exynos 5422 boot ROM, at fixed offsets
	partition bl1 {
		in-partition-table = "no"
		image = "bl1.bin.hardkernel"
		offset = 512
		size = 15K
	}

	partition bl2 {
		in-partition-table = "no"
		image = "bl2.bin.hardkernel.720k_uboot"
		offset = 15872 # 15 KB + 512 B
		size = 16K
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-dtb.bin"
		offset = 32256 # 31 KB + 512 B
		size = 720K
	}

	partition tzsw {
		in-partition-table = "no"
		image = "tzsw.bin.hardkernel"
		offset = 769536 # 751 KB + 512 B
		size = 256K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 2M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
