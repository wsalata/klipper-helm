# SD card / eMMC layout:
#   0-1 MiB   signed boot chain (BL1, BL2, U-Boot, TrustZone) at fixed offsets
#   3 MiB     U-Boot environment (0x310000, 16 KiB): A/B boot order and tries
#   p1 boot   boot.scr (A/B selection, see boot.cmd)
#   p2, p3    root filesystems A and B, each with its own kernel in /boot (RAUC slots)
#   p4 data   settings, network configuration, downloaded updates

image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"boot.scr"
		}
	}
	size = 16M
}

image data.ext4 {
	# Built from the (empty) /data directory, not the whole root filesystem
	mountpoint = "/data"
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	size = 256M
}

image sdcard.img {
	hdimage {
		# Referenced by root=PARTUUID=4b484c4d-02/03 in boot.cmd and by /etc/rauc/system.conf
		disk-signature = 0x4b484c4d
	}

	partition bl1 {
		in-partition-table = "no"
		image = "bl1.bin.hardkernel"
		offset = 512
		size = 15K
	}

	partition bl2 {
		in-partition-table = "no"
		image = "bl2.bin.hardkernel.720k_uboot"
		offset = 15872 # 15 KB + 512 B
		size = 16K
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-dtb.bin"
		offset = 32256 # 31 KB + 512 B
		size = 720K
	}

	partition tzsw {
		in-partition-table = "no"
		image = "tzsw.bin.hardkernel"
		offset = 769536 # 751 KB + 512 B
		size = 256K
	}

	# Starts at 4 MiB, clear of the U-Boot environment at 3 MiB
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 4M
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 256M
	}

	# Starts with the same system, so either slot can boot
	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 256M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
